<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Panel Repartidor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#222}.app{width:100%;max-width:600px;margin:auto;background:#fff;min-height:100vh}.header{padding:18px 16px;background:#111;color:#fff}.brand{font-size:21px;font-weight:bold}.brand span{color:#f5c400}.header-status{font-size:12px;margin-top:5px;color:#ccc}#map{width:100%;height:48vh;min-height:320px}.panel{background:#fff;padding:16px;border-radius:22px 22px 0 0;margin-top:-22px;position:relative;z-index:1000;box-shadow:0 -4px 18px rgba(0,0,0,.15)}.title{font-size:21px;font-weight:bold;margin-bottom:5px}.subtitle{font-size:13px;color:#777;margin-bottom:14px}.status-box{padding:12px;border-radius:12px;background:#fff8d6;border:1px solid #f5c400;margin-bottom:12px;text-align:center}.status-label{font-size:10px;color:#777}.status{font-size:15px;font-weight:bold;margin-top:4px}.step{padding:13px;border-radius:13px;background:#f5f5f5;margin-bottom:10px}.step-title{font-size:11px;color:#777;margin-bottom:5px}.address{font-size:14px;font-weight:bold;line-height:19px}.info{display:flex;gap:8px;margin-top:10px}.info-box{flex:1;background:#f5f5f5;padding:12px 8px;border-radius:12px;text-align:center}.info-label{font-size:10px;color:#777}.info-value{font-size:16px;font-weight:bold;margin-top:5px}.price{margin-top:12px;padding:15px;background:#111;color:#fff;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.price-label{font-size:13px}.price-value{font-size:23px;font-weight:bold;color:#f5c400}.btn{width:100%;border:none;padding:15px;border-radius:13px;margin-top:10px;background:#f5c400;color:#111;font-size:15px;font-weight:bold;box-shadow:0 4px 10px rgba(245,196,0,.25)}.btn.dark{background:#111;color:#fff;box-shadow:none}.btn.white{background:#fff;color:#111;border:1px solid #ddd;box-shadow:none}.btn:disabled{background:#aaa;color:#fff;box-shadow:none}.gps{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12px;color:#777}.gps-dot{width:9px;height:9px;border-radius:50%;background:#aaa}.gps-dot.active{background:#f5c400;box-shadow:0 0 0 5px rgba(245,196,0,.18)}.link-box{margin-top:12px;background:#f5f5f5;border-radius:12px;padding:12px}.link-title{font-size:11px;color:#777;margin-bottom:5px}.link{font-size:11px;word-break:break-all;color:#555}.map-message{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:999;background:#fff;padding:9px 14px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:12px;font-weight:bold;white-space:nowrap}.leaflet-control-attribution{font-size:8px}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="brand">MOTO <span>TRANSPORTE</span></div><div id="headerStatus" class="header-status">Esperando servicio</div></div>
<div style="position:relative"><div id="map"></div><div id="mapMessage" class="map-message">Servicio pendiente</div></div>
<div class="panel">
<div class="title">Servicio del repartidor</div>
<div class="subtitle">Administra el viaje y comparte tu ubicación.</div>
<div class="status-box"><div class="status-label">ESTADO DEL SERVICIO</div><div id="serviceStatus" class="status">NUEVO SERVICIO</div></div>
<div class="step"><div class="step-title">PUNTO DE RECOGIDA</div><div id="pickupAddress" class="address">Cargando...</div></div>
<div class="step"><div class="step-title">DESTINO</div><div id="destinationAddress" class="address">Cargando...</div></div>
<div class="info"><div class="info-box"><div class="info-label">DISTANCIA</div><div id="distance" class="info-value">—</div></div><div class="info-box"><div class="info-label">TIEMPO</div><div id="duration" class="info-value">—</div></div></div>
<div class="price"><div class="price-label">VALOR DEL VIAJE</div><div id="price" class="price-value">$0</div></div>
<button id="acceptButton" class="btn">ACEPTAR SERVICIO</button>
<button id="startButton" class="btn" disabled>INICIAR RECORRIDO</button>
<button id="mapsButton" class="btn white" disabled>ABRIR GOOGLE MAPS</button>
<button id="arrivedButton" class="btn white" disabled>LLEGUÉ AL PUNTO DE RECOGIDA</button>
<button id="pickedButton" class="btn white" disabled>PEDIDO RECOGIDO</button>
<button id="finishButton" class="btn dark" disabled>FINALIZAR SERVICIO</button>
<div class="gps"><div id="gpsDot" class="gps-dot"></div><span id="gpsText">GPS detenido</span></div>
<div id="linkBox" class="link-box" style="display:none"><div class="link-title">ENLACE DE SEGUIMIENTO DEL CLIENTE</div><div id="trackingLink" class="link"></div><button id="copyButton" class="btn white">COPIAR ENLACE</button></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VIAJE_ID="MT-"+Date.now();
const map=L.map("map",{zoomControl:false,attributionControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let pickupLat=21.1561,pickupLng=-100.9333,destinationLat=21.1600,destinationLng=-100.9250;
let pickupMarker=null,destinationMarker=null,repartidorMarker=null,routeLayer=null,watchId=null;
let estado="Nuevo servicio";
let trackingData={};
const datosPrueba={pickupAddress:"Punto de recogida del cliente",destinationAddress:"Destino del cliente",distance:"2.8 km",duration:"9 min",price:"$45"};
document.getElementById("pickupAddress").innerText=datosPrueba.pickupAddress;
document.getElementById("destinationAddress").innerText=datosPrueba.destinationAddress;
document.getElementById("distance").innerText=datosPrueba.distance;
document.getElementById("duration").innerText=datosPrueba.duration;
document.getElementById("price").innerText=datosPrueba.price;
function crearIcono(tipo){return L.divIcon({className:"",html:'<div style="width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;background:'+(tipo==="repartidor"?"#111":tipo==="recogida"?"#f5c400":"#111")+';border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,.35)"><div style="width:11px;height:11px;border-radius:50%;background:white"></div></div>',iconSize:[38,38],iconAnchor:[19,38]})}
pickupMarker=L.marker([pickupLat,pickupLng],{icon:crearIcono("recogida")}).addTo(map);
destinationMarker=L.marker([destinationLat,destinationLng],{icon:crearIcono("destino")}).addTo(map);
routeLayer=L.polyline([[pickupLat,pickupLng],[destinationLat,destinationLng]],{weight:5,opacity:.7}).addTo(map);
map.fitBounds([[pickupLat,pickupLng],[destinationLat,destinationLng]],{padding:[40,40]});
function actualizarEstado(nuevo){estado=nuevo;document.getElementById("serviceStatus").innerText=nuevo;document.getElementById("headerStatus").innerText=nuevo;document.getElementById("mapMessage").innerText=nuevo;guardarSeguimiento()}
function guardarSeguimiento(){trackingData={id:VIAJE_ID,estado:estado,latitud_repartidor:repartidorMarker?repartidorMarker.getLatLng().lat:null,longitud_repartidor:repartidorMarker?repartidorMarker.getLatLng().lng:null,direccion_recogida:datosPrueba.pickupAddress,direccion_destino:datosPrueba.destinationAddress,distancia:datosPrueba.distance,tiempo:datosPrueba.duration,precio:datosPrueba.price,actualizado:new Date().toISOString()};localStorage.setItem("MOTO_TAXI_"+VIAJE_ID,JSON.stringify(trackingData));localStorage.setItem("MOTO_TAXI_ULTIMO",JSON.stringify(trackingData))}
function iniciarGPS(){if(!navigator.geolocation){alert("Este teléfono no permite utilizar GPS.");return}document.getElementById("gpsText").innerText="Obteniendo ubicación...";watchId=navigator.geolocation.watchPosition(function(position){const lat=position.coords.latitude,lng=position.coords.longitude;if(!repartidorMarker){repartidorMarker=L.marker([lat,lng],{icon:crearIcono("repartidor")}).addTo(map);map.setView([lat,lng],16)}else{repartidorMarker.setLatLng([lat,lng])}document.getElementById("gpsDot").classList.add("active");document.getElementById("gpsText").innerText="GPS activo · ubicación actualizada";guardarSeguimiento()},function(){document.getElementById("gpsText").innerText="No se pudo obtener el GPS";alert("Debes permitir la ubicación GPS para realizar el seguimiento.")},{enableHighAccuracy:true,maximumAge:3000,timeout:10000})}
document.getElementById("acceptButton").addEventListener("click",function(){actualizarEstado("SERVICIO ACEPTADO");this.disabled=true;document.getElementById("startButton").disabled=false;document.getElementById("mapsButton").disabled=false;crearEnlaceSeguimiento()});
document.getElementById("startButton").addEventListener("click",function(){actualizarEstado("EN CAMINO A RECOGER");this.disabled=true;document.getElementById("arrivedButton").disabled=false;iniciarGPS()});
document.getElementById("mapsButton").addEventListener("click",function(){const url="https://www.google.com/maps/dir/?api=1&origin="+pickupLat+","+pickupLng+"&destination="+destinationLat+","+destinationLng+"&travelmode=driving";window.open(url,"_blank")});
document.getElementById("arrivedButton").addEventListener("click",function(){actualizarEstado("LLEGÓ AL PUNTO DE RECOGIDA");this.disabled=true;document.getElementById("pickedButton").disabled=false});
document.getElementById("pickedButton").addEventListener("click",function(){actualizarEstado("PEDIDO RECOGIDO · EN CAMINO AL DESTINO");this.disabled=true;document.getElementById("finishButton").disabled=false});
document.getElementById("finishButton").addEventListener("click",function(){actualizarEstado("SERVICIO ENTREGADO");this.disabled=true;if(watchId!==null)navigator.geolocation.clearWatch(watchId);document.getElementById("gpsDot").classList.remove("active");document.getElementById("gpsText").innerText="GPS detenido";});
function crearEnlaceSeguimiento(){const url=location.href.split("?")[0]+"?seguimiento="+encodeURIComponent(VIAJE_ID);document.getElementById("trackingLink").innerText=url;document.getElementById("linkBox").style.display="block";trackingData.url_seguimiento=url;guardarSeguimiento()}
document.getElementById("copyButton").addEventListener("click",async function(){const texto=document.getElementById("trackingLink").innerText;try{await navigator.clipboard.writeText(texto);this.innerText="ENLACE COPIADO";setTimeout(()=>this.innerText="COPIAR ENLACE",1500)}catch(e){alert(texto)}});
window.addEventListener("beforeunload",function(){if(watchId!==null)navigator.geolocation.clearWatch(watchId)});
</script>
</body>
</html>
